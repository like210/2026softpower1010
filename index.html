    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', sans-serif;
            user-select: none;
        }

        /* Canvas / Map View Container */
        .map-container {
            position: relative;
            overflow: hidden;
            background-color: #f8fafc;
            touch-action: none;
        }

        /* Marker Styles */
        .marker {
            position: absolute;
            transform: translate(-50%, -100%);
            transition: transform 0.15s ease, filter 0.15s ease;
            cursor: pointer;
            z-index: 10;
        }

        .marker:hover {
            transform: translate(-50%, -108%) scale(1.1);
            z-index: 30;
        }

        .marker.current-location {
            transform: translate(-50%, -100%);
            z-index: 25;
        }

        /* Ripple effect for current location */
        .pulse-ring {
            position: absolute;
            top: 75%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            background-color: rgba(239, 68, 68, 0.4);
            border-radius: 50%;
            animation: pulse 2s infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(2.2);
                opacity: 0;
            }
        }

        /* Speech Bubble Popup Style */
        .speech-bubble {
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #0f172a;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 10px 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            white-space: normal;
            width: 190px;
            z-index: 50;
            animation: bubbleFadeIn 0.2s ease-out;
        }

        /* Speech Bubble Tail */
        .speech-bubble::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 7px;
            border-style: solid;
            border-color: #0f172a transparent transparent transparent;
        }

        @keyframes bubbleFadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, 8px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        /* Grid lines overlay for setup mode */
        .grid-overlay {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(203, 213, 225, 0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(203, 213, 225, 0.3) 1px, transparent 1px);
        }
    </style>

    <script>
        const ADMIN_PASSWORD = "1234"; 

        const SPREADSHEET_ID = "1gid3GMoo1hNpS7fWX23sumPqwO36ikB1JZRAdmJerKA";
        const GOOGLE_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv`;

        let currentDay = 1;
        let isSetupMode = false;
        let activeSelectedBoothId = null;
        let openBubbleBoothId = null;

        const defaultCoordinates = [
            { x: 18, y: 55 }, { x: 14, y: 72 }, { x: 26, y: 78 }, { x: 33, y: 52 },
            { x: 40, y: 56 }, { x: 47, y: 54 }, { x: 54, y: 56 }, { x: 62, y: 58 },
            { x: 81, y: 54 }, { x: 86, y: 72 }, { x: 78, y: 78 }, { x: 37, y: 82 }, { x: 45, y: 82 }
        ];

        let currentLocationPin = { x: 50, y: 22 };

        let appData = {
            days: { 1: [], 2: [], 3: [] },
            currentLocation: { ...currentLocationPin }
        };

        // CSV 라인 분석 함수
        function parseCSV(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const result = [];
            
            for (let i = 1; i < lines.length; i++) {
                const matches = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
                const cols = matches.map(c => c.replace(/^"|"$/g, '').trim());
                
                // 새로운 시트 컬럼 순서 매핑:
                // cols[0]: 일자, cols[1]: 학년, cols[2]: 부스번호, cols[3]: 부스명, cols[4]: 운영자, cols[5]: 한줄소개
                if (cols.length >= 4) {
                    result.push({
                        day: parseInt(cols[0]) || 1,
                        grade: cols[1] || '',
                        boothNo: parseInt(cols[2]) || null,
                        name: cols[3] || '',
                        operator: cols[4] || '',
                        intro: cols[5] || ''
                    });
                }
            }
            return result;
        }

        async function fetchGoogleSheetData() {
            try {
                const response = await fetch(GOOGLE_CSV_URL);
                if (!response.ok) throw new Error('구글 시트 응답 실패');
                const csvText = await response.text();
                const parsedRows = parseCSV(csvText);

                if (parsedRows.length > 0) {
                    const newDays = { 1: [], 2: [], 3: [] };

                    parsedRows.forEach((row) => {
                        const dayNum = [1, 2, 3].includes(row.day) ? row.day : 1;
                        const existingList = newDays[dayNum];
                        const idx = existingList.length;

                        // 학년에 따른 마커 색상 (1학년: amber/노랑, 2학년: sky/파랑, 기타: rose/핑크)
                        let color = 'amber';
                        if (row.grade.includes('2')) color = 'sky';
                        else if (row.grade.includes('이벤트') || row.grade.includes('3')) color = 'rose';

                        let descText = '';
                        if (row.operator) descText += `운영자: ${row.operator}`;
                        if (row.intro) descText += (descText ? '\n' : '') + row.intro;

                        // 부스 번호가 등록되어 있으면 해당 번호 위치의 좌표 사용, 없으면 순서대로 배치
                        const posIndex = (row.boothNo && row.boothNo > 0) ? (row.boothNo - 1) : idx;
                        const coord = defaultCoordinates[posIndex % defaultCoordinates.length];

                        existingList.push({
                            id: `b${dayNum}_${row.boothNo || (idx + 1)}`,
                            name: row.name || (row.boothNo ? `부스 #${row.boothNo}` : `부스 #${idx + 1}`),
                            desc: descText,
                            color: color,
                            x: coord.x,
                            y: coord.y
                        });
                    });

                    appData.days = newDays;
                    saveData();
                }
            } catch (err) {
                console.warn('구글 시트 로드 실패, 저장된 데이터를 유지합니다.', err);
            }
        }

        function loadData() {
            const saved = localStorage.getItem('booth_app_data_v6');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to parse saved booth data', e);
                }
            }
        }

        function saveData() {
            localStorage.setItem('booth_app_data_v6', JSON.stringify(appData));
            renderSidebar();
            renderPins();
        }

        window.addEventListener('load', async () => {
            loadData();
            await fetchGoogleSheetData();
            switchDay(1);
            resetZoom();
            lucide.createIcons();
        });

        function switchDay(day) {
            currentDay = day;
            activeSelectedBoothId = null;
            openBubbleBoothId = null;
            updatePlacementToolbar();

            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`day-btn-${i}`);
                if (i === day) {
                    btn.className = "day-tab flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center justify-center gap-1 bg-indigo-600 text-white shadow-sm";
                } else {
                    btn.className = "day-tab flex-1 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all flex items-center justify-center gap-1";
                }
            }

            document.getElementById('sidebar-day-title').innerText = `${day}일차`;
            renderSidebar();
            renderPins();
        }

        function toggleMode() {
            if (!isSetupMode) {
                const inputPassword = prompt("관리자 설정 모드로 전환하려면 비밀번호를 입력하세요:");
                if (inputPassword === null) return;
                
                if (inputPassword !== ADMIN_PASSWORD) {
                    alert("비밀번호가 올바르지 않습니다.");
                    return;
                }
            }

            isSetupMode = !isSetupMode;
            activeSelectedBoothId = null;
            openBubbleBoothId = null;

            const modeBadge = document.getElementById('mode-badge');
            const modeBtnText = document.getElementById('mode-btn-text');
            const sidebar = document.getElementById('admin-sidebar');
            const gridOverlay = document.getElementById('grid-overlay');

            if (isSetupMode) {
                modeBadge.className = "text-xs px-2 py-0.5 rounded-full bg-amber-500 text-slate-950 font-bold";
                modeBadge.innerText = "관리자 설정 모드";
                modeBtnText.innerText = "안내 모드로 변경";
                sidebar.classList.remove('hidden', '-translate-x-full');
                sidebar.classList.add('translate-x-0');
                gridOverlay.classList.remove('hidden');
            } else {
                modeBadge.className = "text-xs px-2 py-0.5 rounded-full bg-indigo-600 text-indigo-100 font-medium";
                modeBadge.innerText = "안내 모드";
                modeBtnText.innerText = "부스 위치 및 팀 설정";
                sidebar.classList.remove('translate-x-0');
                sidebar.classList.add('-translate-x-full', 'hidden');
                gridOverlay.classList.add('hidden');
            }

            updatePlacementToolbar();
            renderPins();
            renderSidebar();
        }

        function closeActiveBubble() {
            if (openBubbleBoothId) {
                openBubbleBoothId = null;
                renderPins();
            }
        }

        function toggleSpeechBubble(boothId, e) {
            if (e) e.stopPropagation();
            if (openBubbleBoothId === boothId) {
                openBubbleBoothId = null;
            } else {
                openBubbleBoothId = boothId;
            }
            renderPins();
        }

        function renderSidebar() {
            const container = document.getElementById('team-list-container');
            container.innerHTML = '';
            const teams = appData.days[currentDay] || [];

            let placedCount = 0;

            const curLocItem = document.createElement('div');
            curLocItem.className = `p-2.5 rounded-xl border transition-all flex items-center justify-between cursor-pointer ${
                activeSelectedBoothId === 'CURRENT_LOCATION' 
                ? 'bg-rose-950/60 border-rose-500 ring-2 ring-rose-500/30' 
                : 'bg-slate-900 border-slate-700/80 hover:border-slate-600'
            }`;
            curLocItem.onclick = () => selectBoothForPlacement('CURRENT_LOCATION');
            curLocItem.innerHTML = `
                <div class="flex items-center gap-2.5 overflow-hidden">
                    <span class="w-7 h-7 rounded-lg bg-rose-600 text-white flex items-center justify-center shrink-0 font-bold text-xs shadow-md">
                        📍
                    </span>
                    <div class="truncate">
                        <div class="text-xs font-bold text-rose-300">현재 위치 핀</div>
                        <div class="text-[10px] text-slate-400 truncate">선택 후 지도를 클릭하여 이동</div>
                    </div>
                </div>
                <span class="text-[10px] px-2 py-0.5 bg-rose-900/50 text-rose-300 rounded font-medium border border-rose-700/50">
                    공통
                </span>
            `;
            container.appendChild(curLocItem);

            const divider = document.createElement('div');
            divider.className = "text-[11px] font-semibold text-slate-400 pt-2 pb-1 px-1 flex justify-between items-center";
            divider.innerHTML = `<span>등록된 부스 (${teams.length}개)</span> <span class="text-[10px] text-amber-400 font-normal">클릭하여 정보 편집</span>`;
            container.appendChild(divider);

            teams.forEach((team, index) => {
                if (team.x !== null && team.y !== null) placedCount++;

                const isSelected = activeSelectedBoothId === team.id;
                const item = document.createElement('div');
                item.className = `p-2.5 rounded-xl border transition-all flex items-center justify-between gap-2 ${
                    isSelected 
                    ? 'bg-amber-950/60 border-amber-500 ring-2 ring-amber-500/30' 
                    : team.x !== null 
                        ? 'bg-slate-900 border-slate-700 hover:border-slate-600' 
                        : 'bg-slate-900/40 border-slate-800 opacity-75'
                }`;

                item.innerHTML = `
                    <div class="flex items-center gap-2 flex-1 min-w-0 cursor-pointer" onclick="openBoothEditModal('${team.id}')">
                        <span class="w-6 h-6 rounded-lg ${getBgColorByColorName(team.color)} text-slate-950 font-bold text-xs flex items-center justify-center shrink-0">
                            ${index + 1}
                        </span>
                        <div class="flex flex-col truncate">
                            <span class="text-xs text-slate-100 font-bold truncate">${escapeHtml(team.name)}</span>
                            <span class="text-[10px] text-slate-400 truncate">${escapeHtml(team.desc || '설명 없음')}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button onclick="openBoothEditModal('${team.id}')" title="편집" class="text-slate-400 hover:text-amber-300 text-xs p-1">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        ${team.x !== null ? `
                            <button onclick="removeBoothPosition('${team.id}')" title="위치 해제" class="text-slate-400 hover:text-rose-400 text-xs p-1">
                                <i class="fa-solid fa-location-slash"></i>
                            </button>
                        ` : `
                            <span class="text-[10px] text-slate-500 px-1.5 py-0.5 border border-slate-800 rounded">미배치</span>
                        `}
                    </div>
                `;
                container.appendChild(item);
            });

            document.getElementById('placed-count').innerText = placedCount;
        }

        function getBgColorByColorName(color) {
            switch(color) {
                case 'sky': return 'bg-sky-400';
                case 'rose': return 'bg-rose-400 text-white';
                case 'amber':
                default: return 'bg-amber-400';
            }
        }

        function addNewBoothFromSidebar() {
            const teams = appData.days[currentDay] || [];
            const newId = `b${currentDay}_${Date.now()}`;
            teams.push({
                id: newId,
                name: `신규 부스 #${teams.length + 1}`,
                desc: '운영자 명단 및 한줄소개',
                color: 'amber',
                x: null,
                y: null
            });
            saveData();
            openBoothEditModal(newId);
        }

        function applyBulkTeams() {
            const textarea = document.getElementById('bulk-input');
            const lines = textarea.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            
            if (lines.length === 0) return;

            const currentTeams = appData.days[currentDay] || [];
            
            lines.forEach((line, idx) => {
                if (idx < currentTeams.length) {
                    currentTeams[idx].name = line;
                } else {
                    currentTeams.push({
                        id: `b${currentDay}_${Date.now()}_${idx}`,
                        name: line,
                        desc: '운영 명단 및 안내',
                        color: 'amber',
                        x: null,
                        y: null
                    });
                }
            });

            textarea.value = '';
            saveData();
        }

        function selectBoothForPlacement(boothId) {
            if (!isSetupMode) return;
            activeSelectedBoothId = (activeSelectedBoothId === boothId) ? null : boothId;
            updatePlacementToolbar();
            renderSidebar();
        }

        function clearSelectedPlacement() {
            activeSelectedBoothId = null;
            updatePlacementToolbar();
            renderSidebar();
        }

        function updatePlacementToolbar() {
            const toolbar = document.getElementById('placement-toolbar');
            const nameEl = document.getElementById('selected-booth-name');

            if (isSetupMode && activeSelectedBoothId) {
                toolbar.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
                if (activeSelectedBoothId === 'CURRENT_LOCATION') {
                    nameEl.innerText = "📍 현재 위치 핀 (이동 대기 중)";
                } else {
                    const team = appData.days[currentDay].find(t => t.id === activeSelectedBoothId);
                    nameEl.innerText = team ? `${team.name} (위치 재지정)` : "선택됨";
                }
            } else {
                toolbar.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
            }
        }

        function removeBoothPosition(boothId) {
            const team = appData.days[currentDay].find(t => t.id === boothId);
            if (team) {
                team.x = null;
                team.y = null;
                saveData();
            }
        }

        function renderPins() {
            const container = document.getElementById('pins-layer');
            container.innerHTML = '';

            // 1. Current Location Pin
            const curLoc = appData.currentLocation || currentLocationPin;
            const curPin = document.createElement('div');
            curPin.className = 'marker current-location flex flex-col items-center';
            curPin.style.left = `${curLoc.x}%`;
            curPin.style.top = `${curLoc.y}%`;

            curPin.innerHTML = `
                <div class="relative flex items-center justify-center">
                    <div class="pulse-ring"></div>
                    <img src="https://maps.google.com/mapfiles/ms/icons/red-dot.png" class="w-9 h-9 drop-shadow-lg filter hover:brightness-110 transition" alt="현재위치">
                </div>
                <div class="mt-0.5 bg-rose-600 text-white font-extrabold text-[11px] px-2 py-0.5 rounded-full shadow-lg border border-white flex items-center gap-1">
                    <i class="fa-solid fa-location-crosshairs text-[10px]"></i> 현재위치
                </div>
            `;
            
            if (isSetupMode) {
                makeElementDraggable(curPin, (newX, newY) => {
                    appData.currentLocation = { x: newX, y: newY };
                    saveData();
                });
            }

            container.appendChild(curPin);

            // 2. Booth Pins
            const teams = appData.days[currentDay] || [];

            teams.forEach((team, index) => {
                if (team.x === null || team.y === null) return;

                const pin = document.createElement('div');
                const isSelected = activeSelectedBoothId === team.id;
                const isBubbleOpen = openBubbleBoothId === team.id;
                const pinBg = getBgColorByColorName(team.color);

                pin.className = `marker flex flex-col items-center group ${isSelected || isBubbleOpen ? 'z-40 scale-105' : ''}`;
                pin.style.left = `${team.x}%`;
                pin.style.top = `${team.y}%`;

                let bubbleHtml = '';
                if (isBubbleOpen && !isSetupMode) {
                    const descFormatted = escapeHtml(team.desc || '등록된 정보가 없습니다.').replace(/\n/g, '<br>');
                    bubbleHtml = `
                        <div class="speech-bubble" onclick="event.stopPropagation()">
                            <div class="flex items-center justify-between pb-1.5 mb-1.5 border-b border-slate-700/80">
                                <span class="text-[11px] font-black text-amber-400">부스 #${index + 1}</span>
                                <button onclick="closeActiveBubble()" class="text-slate-400 hover:text-white text-xs">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            <h4 class="font-bold text-xs text-slate-100 mb-1 leading-snug">${escapeHtml(team.name)}</h4>
                            <div class="text-[11px] text-slate-300 leading-relaxed font-normal">${descFormatted}</div>
                        </div>
                    `;
                }

                pin.innerHTML = `
                    ${bubbleHtml}
                    <div class="w-8 h-8 rounded-full ${pinBg} font-black text-xs flex items-center justify-center border-2 border-white shadow-xl group-hover:scale-110 transition-transform">
                        ${index + 1}
                    </div>
                    <div class="mt-1 bg-slate-900/90 backdrop-blur text-slate-100 text-[11px] font-bold px-2 py-0.5 rounded-md shadow-md border border-slate-700/80 max-w-[120px] truncate text-center">
                        ${escapeHtml(team.name)}
                    </div>
                `;

                pin.onclick = (e) => {
                    e.stopPropagation();
                    if (isSetupMode) {
                        openBoothEditModal(team.id);
                    } else {
                        toggleSpeechBubble(team.id, e);
                    }
                };

                if (isSetupMode) {
                    makeElementDraggable(pin, (newX, newY) => {
                        team.x = newX;
                        team.y = newY;
                        saveData();
                    });
                }

                container.appendChild(pin);
            });
        }

        const mapWrapper = document.getElementById('map-wrapper');
        mapWrapper.addEventListener('click', (e) => {
            if (!isSetupMode) {
                closeActiveBubble();
                return;
            }

            const rect = mapWrapper.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const xPercent = Math.round((clickX / rect.width) * 10000) / 100;
            const yPercent = Math.round((clickY / rect.height) * 10000) / 100;

            if (activeSelectedBoothId === 'CURRENT_LOCATION') {
                appData.currentLocation = { x: xPercent, y: yPercent };
                activeSelectedBoothId = null;
                saveData();
                updatePlacementToolbar();
            } else if (activeSelectedBoothId) {
                const team = appData.days[currentDay].find(t => t.id === activeSelectedBoothId);
                if (team) {
                    team.x = xPercent;
                    team.y = yPercent;
                }
                activeSelectedBoothId = null;
                saveData();
                updatePlacementToolbar();
            } else {
                openBoothEditModal(null, xPercent, yPercent);
            }
        });

        function openBoothEditModal(boothId = null, x = null, y = null) {
            const modal = document.getElementById('booth-edit-modal');
            const card = document.getElementById('booth-edit-card');
            const nameInput = document.getElementById('modal-edit-name');
            const descInput = document.getElementById('modal-edit-desc');
            const deleteBtn = document.getElementById('modal-delete-btn');

            document.getElementById('modal-edit-id').value = boothId || '';
            document.getElementById('modal-edit-x').value = x !== null ? x : '';
            document.getElementById('modal-edit-y').value = y !== null ? y : '';

            if (boothId) {
                const team = appData.days[currentDay].find(t => t.id === boothId);
                if (team) {
                    nameInput.value = team.name;
                    descInput.value = team.desc || '';
                    const radio = document.querySelector(`input[name="pin-color"][value="${team.color || 'amber'}"]`);
                    if (radio) radio.checked = true;
                }
                deleteBtn.classList.remove('hidden');
            } else {
                const count = (appData.days[currentDay] || []).length + 1;
                nameInput.value = `부스 ${count}`;
                descInput.value = '';
                document.querySelector('input[name="pin-color"][value="amber"]').checked = true;
                deleteBtn.classList.add('hidden');
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
            setTimeout(() => nameInput.focus(), 100);
        }

        function closeBoothEditModal() {
            const modal = document.getElementById('booth-edit-modal');
            const card = document.getElementById('booth-edit-card');
            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
        }

        function saveBoothFromModal(e) {
            e.preventDefault();
            const boothId = document.getElementById('modal-edit-id').value;
            const x = document.getElementById('modal-edit-x').value;
            const y = document.getElementById('modal-edit-y').value;
            const name = document.getElementById('modal-edit-name').value;
            const desc = document.getElementById('modal-edit-desc').value;
            const color = document.querySelector('input[name="pin-color"]:checked').value;

            const teams = appData.days[currentDay];

            if (boothId) {
                const team = teams.find(t => t.id === boothId);
                if (team) {
                    team.name = name;
                    team.desc = desc;
                    team.color = color;
                }
            } else {
                teams.push({
                    id: `b${currentDay}_${Date.now()}`,
                    name: name,
                    desc: desc,
                    color: color,
                    x: parseFloat(x),
                    y: parseFloat(y)
                });
            }

            closeBoothEditModal();
            saveData();
        }

        function deleteBoothFromModal() {
            const boothId = document.getElementById('modal-edit-id').value;
            if (!boothId) return;

            if (confirm('해당 부스를 마킹과 명단에서 삭제하시겠습니까?')) {
                appData.days[currentDay] = appData.days[currentDay].filter(t => t.id !== boothId);
                closeBoothEditModal();
                saveData();
            }
        }

        function makeElementDraggable(elmnt, onDragEnd) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elmnt.onmousedown = dragMouseDown;
            elmnt.ontouchstart = dragMouseDown;

            function dragMouseDown(e) {
                if (!isSetupMode) return;
                e.stopPropagation();
                
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                pos3 = clientX;
                pos4 = clientY;

                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                document.ontouchend = closeDragElement;
                document.ontouchmove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;

                const parentRect = mapWrapper.getBoundingClientRect();
                let newLeft = elmnt.offsetLeft - pos1;
                let newTop = elmnt.offsetTop - pos2;

                let xPct = Math.min(Math.max((newLeft / parentRect.width) * 100, 2), 98);
                let yPct = Math.min(Math.max((newTop / parentRect.height) * 100, 2), 98);

                elmnt.style.left = xPct + "%";
                elmnt.style.top = yPct + "%";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchend = null;
                document.ontouchmove = null;

                const xPct = parseFloat(elmnt.style.left);
                const yPct = parseFloat(elmnt.style.top);
                onDragEnd(Math.round(xPct * 100) / 100, Math.round(yPct * 100) / 100);
            }
        }

        let zoomLevel = 1;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let startX, startY;

        const viewport = document.getElementById('map-viewport');
        const wrapper = document.getElementById('map-wrapper');

        function updateTransform() {
            wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
        }

        function zoomIn() {
            zoomLevel = Math.min(zoomLevel + 0.2, 2.5);
            updateTransform();
        }

        function zoomOut() {
            zoomLevel = Math.max(zoomLevel - 0.2, 0.7);
            updateTransform();
        }

        function resetZoom() {
            zoomLevel = 1;
            panX = 0;
            panY = 0;
            wrapper.style.transition = 'transform 0.25s ease-out';
            updateTransform();
            
            setTimeout(() => {
                wrapper.style.transition = 'transform 75ms ease-out';
            }, 250);
        }

        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.marker')) return;
            isPanning = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
        });

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1 && !e.target.closest('.marker')) {
                isPanning = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            }
        });

        viewport.addEventListener('touchmove', (e) => {
            if (isPanning && e.touches.length === 1) {
                panX = e.touches[0].clientX - startX;
                panY = e.touches[0].clientY - startY;
                updateTransform();
            }
        });

        viewport.addEventListener('touchend', () => {
            isPanning = false;
        });

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
